spring:
  application:
    name: erp
  profiles:
    active: dev
  config:
    import:
      - optional:classpath:.env.postgres.properties

sharp:
  database:
    type: PostgreSQL
    entity-base-package: com.rick.erp.**.entity
#    track-if-has-update: true
server:
  port: 7002
  # 经网关转发时接收 X-Forwarded-Prefix（/api/erp），springdoc 据此生成带前缀的
  # swagger-config/api-docs URL；直连 7002 无该头，不受影响
  forward-headers-strategy: framework
