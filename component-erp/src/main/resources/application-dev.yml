spring:
  datasource:
    url: ${JDBC.URL}
    username: ${JDBC.USERNAME}
    password: ${JDBC.PASSWORD}
  hikari:
    # 2核：2 * 2 + 1 = 5，留余量设 10
    maximum-pool-size: 10

    minimum-idle: 2
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000

logging:
  level:
    root: INFO
    com.devyean.erp: DEBUG
    com.rick.db.repository: DEBUG
    org:
      springdoc: OFF

  file:
    path: /Users/rick/Space/tmp/erp/log

fileupload:
  tmp: /Users/rick/Space/tmp/erp/tmp # 下载的临时目录
  local: # cd /Users/rick/Space/tmp/fileupload && http-server -p 7892
    root-path: /Users/rick/Space/tmp/erp/files
    server-url: http://127.0.0.1:7892/ # 映射到tmp目录

dubbo:
  registry:
    address: nacos://127.0.0.1:8848
    register-mode: instance
  protocol:
    port: 20881
  qos:
    port: 22223

app:
  domain: http://127.0.0.1:8080
  version: v2026.04.16