group = 'com.rick.common.component.starter'
version = libs.versions.sharp.get()
description = 'component-starter'

// 库模块，无主类：禁用 bootJar，使用普通 jar
bootJar { enabled = false }
jar { enabled = true }

dependencies {
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-jdbc'
    api 'org.springframework.boot:spring-boot-starter-validation'

    api 'com.rick.db:sharp-database:0.0.1-SNAPSHOT'
    api 'com.rick.meta:sharp-meta:0.0.1-SNAPSHOT'
    api 'com.rick.formflow:sharp-formflow:0.0.1-SNAPSHOT'
    api 'com.rick.fileupload:sharp-fileupload:0.0.1-SNAPSHOT'
    api 'org.postgresql:postgresql'

    api("com.rick.excel:sharp-excel:3.0-SNAPSHOT") {
        exclude group: 'com.rick.db', module: 'sharp-database2'
        exclude group: 'com.rick.common', module: 'sharp-common'
    }

    // 添加 openapi
    api 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'

    // dubbo
    api 'org.apache.dubbo:dubbo-spring-boot-starter'
    api 'org.apache.dubbo:dubbo-nacos-spring-boot-starter'

    // nacos 服务注册发现（Web 实例，供网关 lb:// 路由；与 Dubbo 实例用 group 隔离）
    api 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery'

    // 权限管理
    api 'org.springframework.boot:spring-boot-starter-security'

    api ('com.rick.generator:sharp-generator:3.0-SNAPSHOT') {
        exclude group: 'com.rick.common', module: 'sharp-common'
        exclude group: 'com.rick.db', module: 'sharp-database2'
//        exclude group: 'com.rick.report', module: 'sharp-report'
        exclude group: 'com.rick.meta', module: 'sharp-meta'
        exclude group: 'com.rick.formflow', module: 'sharp-formflow'
        exclude group: 'com.rick.fileupload', module: 'sharp-fileupload'
    }
}
