group = 'com.rick.gateway'
version = libs.versions.sharp.get()
description = 'gateway'

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.0.3"
    }
}

dependencies {
    // dubbo
    api 'org.apache.dubbo:dubbo-spring-boot-starter'
    api 'org.apache.dubbo:dubbo-nacos-spring-boot-starter'

    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'

    // nacos 服务注册发现（网关自身注册 + lb:// 路由的服务发现）
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
}
