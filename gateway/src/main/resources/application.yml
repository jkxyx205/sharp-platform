spring:
  application:
    name: gateway
  config:
    import:
      - optional:classpath:.env.sms.properties
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        # Web 实例单独分组，与 Dubbo 注册的实例（DEFAULT_GROUP）隔离
        group: WEB_GROUP
    gateway:
      server:
        webflux:
          routes:
            - id: site
              uri: lb://site
              predicates:
                - Path=/api/site/**
              filters:
                - StripPrefix=2
            - id: erp
              uri: lb://erp
              predicates:
                - Path=/api/erp/**
              filters:
                - StripPrefix=2
            - id: platform
              uri: lb://platform
              predicates:
                - Path=/api/platform/**
              filters:
                - StripPrefix=2
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                  - PATCH
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_FIRST
server:
  port: 8769

dubbo:
  registry:
    address: nacos://127.0.0.1:8848
    register-mode: instance
  application:
    # 网关无 Dubbo 服务可导出，纯消费者也需注册实例
    register-consumer: true
    qos-port: 22224

ali:
  access-key:
    id: ${ID}
    secret: ${SECRET}

# 验证码：有效期、内容可配置；types 定义业务类型（图片/短信+模板），rules 定义需校验的业务 URL
captcha:
  expire-seconds: 300
  sign-name: 点研智能科技
  image:
    length: 4
    width: 120
    height: 40
  sms:
    length: 6
  types:
    register:
      kind: sms
      template: SMS_182410004
      # 发送前业务预检查：CodePreHandler Bean 名，已注册手机号拒绝发码
      pre-handler: registerCodePreHandler
    chgpwd:
      kind: sms
      template: SMS_202561330
    login:
      kind: image
    mobile_login:
      kind: sms
      template: SMS_182410004
  rules:
    # 需要验证码校验的业务 URL（网关原始路径，StripPrefix 之前），示例：
     - url: /auth/register      # type 默认取 URL 最后一段 = register
     - url: /api/platform/auth/register      # type 默认取 URL 最后一段 = register
    # - url: /xx/xx/register
    #   type: user_register
    #   mobile: com.rick.sms.MobileResolver.getCustomerMobile
     - url: /api/platform/users/chgpwd
     - url: /auth/login
       type: login
       # 手机验证码登录
     - url: /auth/mobile_login