spring:
  application:
    name: site
  profiles:
    active: dev
  config:
    import:
      - optional:classpath:.env.postgres.properties

dict:
  items:
    - type: MATERIAL_TYPE
      sql: "select code, description from mm_code_group where category_code = 'MATERIAL' and is_deleted = false"
    - type: JudgeLevelEnum
      map: { "A": "A(优秀入围)", "B": "B(良好)", "C": "C(一般)" }

sharp:
  database:
    type: PostgreSQL
    entity-base-package: com.rick.site.**.entity
#    track-if-has-update: true
server:
  port: 7001
